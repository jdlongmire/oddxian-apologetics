<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 800" width="1000" height="800">
  <defs>
    <style>
      .text { font-family: Arial, sans-serif; text-anchor: middle; font-size: 13px; }
      .text-bold { font-weight: bold; }
      .text-small { font-size: 11px; }
      .path-label { font-family: Arial, sans-serif; font-size: 10px; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="500" y="25" style="font-family: Arial, sans-serif; font-size: 17px; font-weight: bold; text-anchor: middle; fill: #333;">The Inescapability of Classical Theism</text>

  <!-- START NODE -->
  <rect x="400" y="60" width="200" height="60" rx="5" fill="#f9f9f9" stroke="#333" stroke-width="4"/>
  <text x="500" y="82" class="text text-bold">PURPOSIVE INQUIRY</text>
  <text x="500" y="100" class="text text-small">The act of questioning, arguing,</text>
  <text x="500" y="112" class="text text-small">or evaluating this argument</text>

  <!-- PATH 1: DENIAL (Left) -->
  <path d="M 420 120 Q 180 160 180 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="165" class="path-label">Option 1: Deny</text>
  <text x="280" y="177" class="path-label">Purpose Exists</text>

  <rect x="80" y="230" width="200" height="75" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="180" y="255" class="text text-bold" fill="#990000">PERFORMATIVE</text>
  <text x="180" y="272" class="text text-bold" fill="#990000">SELF-REFUTATION</text>
  <text x="180" y="290" class="text text-small" fill="#990000">'I purposively argue that</text>
  <text x="180" y="300" class="text text-small" fill="#990000">purpose does not exist'</text>

  <!-- PATH 2: PHYSICALISM (Center-Left) -->
  <path d="M 450 120 Q 380 160 380 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="420" y="170" class="path-label">Option 2: Ground in</text>
  <text x="420" y="182" class="path-label">Physical/Emergence</text>

  <rect x="280" y="230" width="200" height="50" rx="5" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="380" y="255" class="text text-bold" fill="#cc7700">The Mereological Test</text>

  <path d="M 380 280 L 380 340" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="307" class="path-label text-small">Syntax cannot</text>
  <text x="440" y="318" class="path-label text-small">produce Semantics</text>

  <rect x="280" y="340" width="200" height="70" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="380" y="362" class="text text-bold" fill="#990000">MEREOLOGICAL FAILURE</text>
  <text x="380" y="382" class="text text-small" fill="#990000">Ontological Gap: Matter</text>
  <text x="380" y="397" class="text text-small" fill="#990000">cannot possess 'Aboutness'</text>

  <!-- PATH 3: SUBJECTIVE (Center-Right) -->
  <path d="M 550 120 Q 620 160 620 230" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="590" y="165" class="path-label">Option 3: Claim</text>
  <text x="590" y="177" class="path-label">'Constructed' Purpose</text>

  <rect x="520" y="230" width="200" height="70" rx="5" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="620" y="252" class="text text-bold" fill="#cc7700">INTENTIONALITY</text>
  <text x="620" y="269" class="text text-bold" fill="#cc7700">PRESUPPOSED</text>
  <text x="620" y="287" class="text text-small" fill="#cc7700">Construction requires</text>
  <text x="620" y="297" class="text text-small" fill="#cc7700">representation &amp; normativity</text>

  <path d="M 550 300 Q 470 320 430 340" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="500" y="327" class="path-label text-small">Still requires grounding</text>

  <!-- PATH 4: PLATONISM (Right) -->
  <path d="M 580 120 Q 780 180 780 270" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="185" class="path-label">Option 4: Ground in</text>
  <text x="700" y="197" class="path-label">Abstract Objects</text>

  <rect x="680" y="270" width="200" height="50" rx="5" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
  <text x="780" y="290" class="text text-bold" fill="#003399">PLATONISM</text>
  <text x="780" y="307" class="text text-small" fill="#003399">Math/Logical objects ultimate</text>

  <path d="M 780 320 L 780 390" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="840" y="350" class="path-label text-small">Causal Inertness</text>
  <text x="840" y="362" class="path-label text-small">Cannot actualize</text>

  <rect x="680" y="390" width="200" height="60" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="780" y="412" class="text text-bold" fill="#990000">EXPLANATORY FAILURE</text>
  <text x="780" y="432" class="text text-small" fill="#990000">Explains order,</text>
  <text x="780" y="442" class="text text-small" fill="#990000">not actuation</text>

  <path d="M 730 450 Q 650 530 580 600" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="670" y="520" class="path-label text-small">Requires Personal Mind</text>

  <!-- PATH 5: MULTIVERSE (Far Left) -->
  <path d="M 450 120 Q 80 350 80 520" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="160" y="400" class="path-label">Option 5:</text>
  <text x="160" y="412" class="path-label">Multiverse</text>

  <rect x="0" y="520" width="160" height="50" rx="5" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="80" y="545" class="text text-bold" fill="#cc7700">MULTIVERSE</text>

  <path d="M 160 545 Q 320 570 420 610" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="565" class="path-label text-small">Generator needs</text>
  <text x="280" y="577" class="path-label text-small">Existence, Selection</text>

  <!-- PATH 6: THEISM (Direct - Far Right side) -->
  <path d="M 600 120 Q 920 380 920 620" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="840" y="220" class="path-label" fill="#006600" font-weight="bold">Option 6:</text>
  <text x="840" y="234" class="path-label" fill="#006600">Personal Necessary</text>
  <text x="840" y="246" class="path-label" fill="#006600">Being (Direct Route)</text>

  <!-- THEISM (CONCLUSION) -->
  <rect x="350" y="600" width="350" height="110" rx="5" fill="#ccffcc" stroke="#009900" stroke-width="4"/>
  <text x="525" y="630" class="text text-bold" fill="#006600" font-size="18px">CLASSICAL THEISM</text>
  <text x="525" y="655" class="text text-small" fill="#006600">✓ Explains Intentionality</text>
  <text x="525" y="672" class="text text-small" fill="#006600">✓ Explains Logical Consistency</text>
  <text x="525" y="689" class="text text-small" fill="#006600">✓ Explains Order-Actuation Unity</text>
  <text x="525" y="706" class="text text-small" fill="#006600">✓ Explains Ontological Selection</text>
</svg>
