<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 900" width="1200" height="900">
  <defs>
    <style>
      .text { font-family: Arial, sans-serif; text-anchor: middle; font-size: 12px; }
      .text-bold { font-weight: bold; }
      .text-small { font-size: 10px; }
      .path-label { font-family: Arial, sans-serif; font-size: 10px; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" style="font-family: Arial, sans-serif; font-size: 18px; font-weight: bold; text-anchor: middle; fill: #333;">The Inescapability of Classical Theism</text>

  <!-- START NODE -->
  <rect x="500" y="70" width="200" height="65" rx="5" fill="#f9f9f9" stroke="#333" stroke-width="4"/>
  <text x="600" y="95" class="text text-bold" font-size="14px">PURPOSIVE INQUIRY</text>
  <text x="600" y="113" class="text text-small">The act of questioning, arguing,</text>
  <text x="600" y="125" class="text text-small">or evaluating this argument</text>

  <!-- LAYER 1: INITIAL OPTIONS ROW -->

  <!-- Option 1: DENIAL -->
  <path d="M 540 135 L 140 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="280" y="175" class="path-label">Option 1:</text>
  <text x="280" y="188" class="path-label">Deny Purpose</text>

  <rect x="40" y="220" width="200" height="70" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2" stroke-dasharray="5,5"/>
  <text x="140" y="243" class="text text-bold" fill="#990000">PERFORMATIVE</text>
  <text x="140" y="258" class="text text-bold" fill="#990000">SELF-REFUTATION</text>
  <text x="140" y="275" class="text text-small" fill="#990000">'I purposively argue</text>
  <text x="140" y="285" class="text text-small" fill="#990000">purpose doesn't exist'</text>

  <!-- Option 2: PHYSICALISM -->
  <path d="M 560 135 L 340 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="440" y="175" class="path-label">Option 2:</text>
  <text x="440" y="188" class="path-label">Physicalism</text>

  <rect x="260" y="220" width="160" height="50" rx="5" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="340" y="240" class="text text-bold" fill="#cc7700">Mereological</text>
  <text x="340" y="254" class="text text-bold" fill="#cc7700">Test</text>

  <!-- Option 3: SUBJECTIVE -->
  <path d="M 600 135 L 540 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="575" y="175" class="path-label">Option 3:</text>
  <text x="575" y="188" class="path-label">Constructed</text>

  <rect x="460" y="220" width="160" height="65" rx="5" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="540" y="241" class="text text-bold" fill="#cc7700">INTENTIONALITY</text>
  <text x="540" y="256" class="text text-bold" fill="#cc7700">PRESUPPOSED</text>
  <text x="540" y="274" class="text text-small" fill="#cc7700">Requires representation</text>

  <!-- Option 4: PLATONISM -->
  <path d="M 640 135 L 740 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="700" y="175" class="path-label">Option 4:</text>
  <text x="700" y="188" class="path-label">Platonism</text>

  <rect x="660" y="220" width="160" height="50" rx="5" fill="#e6f3ff" stroke="#0066cc" stroke-width="2"/>
  <text x="740" y="240" class="text text-bold" fill="#003399">Abstract</text>
  <text x="740" y="254" class="text text-bold" fill="#003399">Objects</text>

  <!-- Option 5: MULTIVERSE -->
  <path d="M 660 135 L 960 220" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="840" y="175" class="path-label">Option 5:</text>
  <text x="840" y="188" class="path-label">Multiverse</text>

  <rect x="880" y="220" width="160" height="50" rx="5" fill="#fff4e6" stroke="#ff9900" stroke-width="2"/>
  <text x="960" y="240" class="text text-bold" fill="#cc7700">Chance/</text>
  <text x="960" y="254" class="text text-bold" fill="#cc7700">Generator</text>

  <!-- LAYER 2: FAILURE NODES -->

  <!-- Physicalism → Mereological Failure -->
  <path d="M 340 270 L 340 360" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="380" y="315" class="path-label text-small">Syntax ≠</text>
  <text x="380" y="326" class="path-label text-small">Semantics</text>

  <rect x="260" y="360" width="160" height="65" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="340" y="379" class="text text-bold" fill="#990000">MEREOLOGICAL</text>
  <text x="340" y="394" class="text text-bold" fill="#990000">FAILURE</text>
  <text x="340" y="412" class="text text-small" fill="#990000">Ontological gap</text>

  <!-- Subjective → needs grounding (to Mereological Failure) -->
  <path d="M 510 285 Q 440 320 380 360" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="455" y="325" class="path-label text-small">Needs grounding</text>

  <!-- Platonism → Explanatory Failure -->
  <path d="M 740 270 L 740 360" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="785" y="315" class="path-label text-small">Causal</text>
  <text x="785" y="326" class="path-label text-small">Inertness</text>

  <rect x="660" y="360" width="160" height="65" rx="5" fill="#ffcccc" stroke="#cc0000" stroke-width="2"/>
  <text x="740" y="379" class="text text-bold" fill="#990000">EXPLANATORY</text>
  <text x="740" y="394" class="text text-bold" fill="#990000">FAILURE</text>
  <text x="740" y="412" class="text text-small" fill="#990000">Order, not actuation</text>

  <!-- Multiverse → needs explanation -->
  <path d="M 930 270 Q 860 315 790 360" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="875" y="315" class="path-label text-small">Generator needs</text>
  <text x="875" y="326" class="path-label text-small">explanation</text>

  <!-- LAYER 3: ALL FAILURES → THEISM -->

  <!-- Mereological Failure → Theism -->
  <path d="M 340 425 Q 420 520 460 650" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="390" y="530" class="path-label text-small">Requires</text>
  <text x="390" y="541" class="path-label text-small">Personal Ground</text>

  <!-- Explanatory Failure → Theism -->
  <path d="M 740 425 Q 680 520 640 650" stroke="#333" stroke-width="2" fill="none" marker-end="url(#arrow)"/>
  <text x="705" y="530" class="path-label text-small">Requires</text>
  <text x="705" y="541" class="path-label text-small">Personal Mind</text>

  <!-- Option 6: DIRECT PATH (straight down center) -->
  <path d="M 600 135 L 550 650" stroke="#009900" stroke-width="3" fill="none" marker-end="url(#arrow)"/>
  <text x="580" y="380" class="path-label" fill="#006600" font-weight="bold">Option 6:</text>
  <text x="580" y="395" class="path-label" fill="#006600" font-weight="bold">Personal</text>
  <text x="580" y="410" class="path-label" fill="#006600" font-weight="bold">Necessary</text>
  <text x="580" y="425" class="path-label" fill="#006600" font-weight="bold">Being</text>
  <text x="580" y="445" class="path-label" fill="#006600">(Direct Route)</text>

  <!-- THEISM (CONCLUSION) -->
  <rect x="350" y="650" width="400" height="120" rx="8" fill="#ccffcc" stroke="#009900" stroke-width="5"/>
  <text x="550" y="685" class="text text-bold" fill="#006600" font-size="20px">CLASSICAL THEISM</text>
  <text x="550" y="710" class="text text-small" fill="#006600">✓ Explains Intentionality</text>
  <text x="550" y="727" class="text text-small" fill="#006600">✓ Explains Logical Consistency</text>
  <text x="550" y="744" class="text text-small" fill="#006600">✓ Explains Order-Actuation Unity</text>
  <text x="550" y="761" class="text text-small" fill="#006600">✓ Explains Ontological Selection</text>

  <!-- Legend -->
  <text x="600" y="820" style="font-family: Arial, sans-serif; font-size: 11px; text-anchor: middle; fill: #666; font-style: italic;">All non-theistic paths encounter insurmountable barriers or require the very thing they seek to avoid</text>
</svg>
