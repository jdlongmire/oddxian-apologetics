<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 300" width="1100" height="300">
  <defs>
    <style>
      .node { stroke-width: 2; rx: 5; }
      .text { font-family: Arial, sans-serif; text-anchor: middle; font-size: 12px; }
      .text-bold { font-weight: bold; font-size: 14px; }
      .text-small { font-size: 11px; }
      .arrow { stroke: #333; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .arrow-label { font-family: Arial, sans-serif; font-size: 11px; fill: #555; text-anchor: middle; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 10 3, 0 6" fill="#333" />
    </marker>
  </defs>

  <!-- PRIOR -->
  <rect x="20" y="80" width="140" height="90" class="node" fill="#e6f3ff" stroke="#0066cc"/>
  <text x="90" y="105" class="text text-bold" fill="#003399">Prior</text>
  <text x="90" y="127" class="text" fill="#003399">Agnostic: 50%</text>
  <text x="90" y="143" class="text text-small" fill="#003399">Starting Point</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="125" x2="200" y2="125" class="arrow"/>
  <text x="180" y="115" class="arrow-label">Bayesian</text>
  <text x="180" y="127" class="arrow-label">Update</text>

  <!-- DEMO 1 -->
  <rect x="210" y="80" width="150" height="90" class="node" fill="#d9f2e6" stroke="#00aa55"/>
  <text x="285" y="105" class="text text-bold" fill="#006600">After Demo II</text>
  <text x="285" y="122" class="text text-small" fill="#006600">Intentionality</text>
  <text x="285" y="138" class="text" fill="#006600">Evidence LR: ~2.8</text>
  <text x="285" y="154" class="text text-bold" fill="#006600">Posterior: ~68%</text>

  <!-- Arrow 2 -->
  <line x1="360" y1="125" x2="400" y2="125" class="arrow"/>
  <text x="380" y="115" class="arrow-label">Bayesian</text>
  <text x="380" y="127" class="arrow-label">Update</text>

  <!-- DEMO 2 -->
  <rect x="410" y="80" width="150" height="90" class="node" fill="#d0f0d9" stroke="#009944"/>
  <text x="485" y="105" class="text text-bold" fill="#006600">After Demo I</text>
  <text x="485" y="122" class="text text-small" fill="#006600">3FLL & Logic</text>
  <text x="485" y="138" class="text" fill="#006600">Evidence LR: ~4.5</text>
  <text x="485" y="154" class="text text-bold" fill="#006600">Posterior: ~85%</text>

  <!-- Arrow 3 -->
  <line x1="560" y1="125" x2="600" y2="125" class="arrow"/>
  <text x="580" y="115" class="arrow-label">Bayesian</text>
  <text x="580" y="127" class="arrow-label">Update</text>

  <!-- DEMO 3 -->
  <rect x="610" y="80" width="150" height="90" class="node" fill="#c7efd0" stroke="#008833"/>
  <text x="685" y="105" class="text text-bold" fill="#006600">After Demo III</text>
  <text x="685" y="122" class="text text-small" fill="#006600">Order-Actuation</text>
  <text x="685" y="138" class="text" fill="#006600">Evidence LR: ~3.2</text>
  <text x="685" y="154" class="text text-bold" fill="#006600">Posterior: ~93%</text>

  <!-- Arrow 4 -->
  <line x1="760" y1="125" x2="800" y2="125" class="arrow"/>
  <text x="780" y="115" class="arrow-label">Bayesian</text>
  <text x="780" y="127" class="arrow-label">Update</text>

  <!-- DEMO 4 -->
  <rect x="810" y="80" width="150" height="90" class="node" fill="#beedc7" stroke="#007722"/>
  <text x="885" y="105" class="text text-bold" fill="#006600">After Demo IV</text>
  <text x="885" y="122" class="text text-small" fill="#006600">Selection</text>
  <text x="885" y="138" class="text" fill="#006600">Evidence LR: ~2.6</text>
  <text x="885" y="154" class="text text-bold" fill="#006600">Posterior: ~96%</text>

  <!-- Arrow 5 -->
  <line x1="960" y1="125" x2="990" y2="125" class="arrow"/>
  <text x="975" y="115" class="arrow-label">Result</text>

  <!-- FINAL -->
  <rect x="1000" y="70" width="170" height="110" class="node" fill="#ccffcc" stroke="#009900" stroke-width="4"/>
  <text x="1085" y="95" class="text text-bold" fill="#006600" font-size="15px">Final Posterior</text>
  <text x="1085" y="117" class="text" fill="#006600">~96% (Agnostic Prior)</text>
  <text x="1085" y="140" class="text text-bold" fill="#006600" font-size="16px">~99.97% (Combined)</text>

  <!-- Title -->
  <text x="550" y="30" style="font-family: Arial, sans-serif; font-size: 16px; font-weight: bold; text-anchor: middle; fill: #333;">Bayesian Updating: From Agnostic Prior to Practical Certainty</text>

  <!-- Legend -->
  <text x="550" y="230" style="font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #555;">Likelihood Ratio (LR) measures how much better theism explains each piece of evidence compared to alternatives</text>
  <text x="550" y="247" style="font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #555;">LR > 1 favors theism | LR > 2 is strong evidence | LR > 4 is very strong evidence</text>
  <text x="550" y="264" style="font-family: Arial, sans-serif; font-size: 12px; text-anchor: middle; fill: #555; font-style: italic;">Conservative estimates: Each demonstration independently raises credence until practical certainty is reached</text>
</svg>
